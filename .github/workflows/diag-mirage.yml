name: diag mirage (temporary)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && playwright install --with-deps chromium > /dev/null
      - shell: python
        run: |
          import re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_context(locale="en-ZA").new_page()
              pg.goto("https://www.miragegaming.co.za/categories", wait_until="domcontentloaded", timeout=60000)
              pg.wait_for_timeout(8000)
              hrefs = sorted(set(pg.eval_on_selector_all("a[href]", "e => e.map(x => x.href + '  <' + x.innerText.trim().slice(0,40) + '>')")))
              print("=== category links:")
              for h in hrefs:
                  if re.search(r"categor|sealed|shop\?|collection", h, re.I):
                      print("  |", h[:200])
              for url in ["https://www.miragegaming.co.za/shop?search=one%20piece",
                          "https://www.miragegaming.co.za/shop?q=one+piece"]:
                  pg.goto(url, wait_until="domcontentloaded", timeout=60000)
                  pg.wait_for_timeout(8000)
                  body = [l.strip() for l in pg.inner_text("body").splitlines() if l.strip()]
                  k = next((i for i, l in enumerate(body) if l.endswith("products")), 0)
                  print(f"=== {url} -> {pg.url}")
                  for l in body[k:k + 25]:
                      print("  |", l[:110])
              b.close()
