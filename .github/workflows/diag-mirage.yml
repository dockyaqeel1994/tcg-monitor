name: diag mirage (temporary)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && playwright install --with-deps chromium > /dev/null
      - shell: python
        run: |
          import re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_context(locale="en-ZA").new_page()
              for url in ["https://www.miragegaming.co.za/shop", "https://www.miragegaming.co.za/"]:
                  resp = pg.goto(url, wait_until="domcontentloaded", timeout=60000)
                  pg.wait_for_timeout(10000)
                  print(f"=== {url} -> status {resp.status if resp else None}, final {pg.url}, title {pg.title()!r}")
                  hrefs = sorted(set(pg.eval_on_selector_all("a[href]", "e => e.map(x => x.href)")))
                  prod = [h for h in hrefs if re.search(r"product|item|/p/", h, re.I)]
                  print("links:", len(hrefs), "product-like:", len(prod), prod[:8])
                  print("other links:", [h for h in hrefs if "miragegaming" in h][:40])
                  body = [l.strip() for l in pg.inner_text("body").splitlines() if l.strip()]
                  print("body lines:", len(body))
                  for l in body[:60]:
                      print("  |", l[:110])
              b.close()
