name: diag p-bandai (temporary)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright requests && playwright install --with-deps chromium > /dev/null
      - shell: python
        run: |
          import re, requests
          from playwright.sync_api import sync_playwright
          urls = [
              "https://p-bandai.com/au/series/onepiece-series",
              "https://p-bandai.com/nz/brand/onepiececardgame",
              "https://p-bandai.com/us/series/onepiece-series?_f_brands=06-0074&_f_series=03-002",
              "https://p-bandai.com/hk/series/onepiece-series?_f_brands=06-0074&_f_series=03-002",
              "https://p-bandai.com/tw/series/onepiece-series?_f_brands=06-0074&_f_series=03-002",
              "https://p-bandai.com/sg/series/onepiece-series?_f_brands=06-0074&_f_series=03-002",
          ]
          for u in urls[:1]:
              try:
                  r = requests.get(u, timeout=30)
                  print(f"plain GET {u} -> {r.status_code}, {len(r.text)} bytes, item links: {len(set(re.findall(r'/item/[A-Za-z0-9_-]+', r.text)))}")
              except Exception as e:
                  print("plain GET failed:", e)
          with sync_playwright() as p:
              b = p.chromium.launch()
              ctx = b.new_context(locale="en-US")
              apis = []
              ctx.on("response", lambda resp: apis.append(f"{resp.status} {resp.url[:150]}")
                     if re.search(r"api|search|product|item", resp.url, re.I) and "json" in (resp.headers.get("content-type") or "") else None)
              pg = ctx.new_page()
              for u in urls:
                  apis.clear()
                  try:
                      resp = pg.goto(u, wait_until="domcontentloaded", timeout=60000)
                      pg.wait_for_timeout(12000)
                      links = sorted(set(pg.eval_on_selector_all("a[href*='/item/']", "e => e.map(x => x.href)")))
                      body = [l.strip() for l in pg.inner_text("body").splitlines() if l.strip()]
                      print(f"=== {u}\n status {resp.status if resp else None} | final {pg.url} | title {pg.title()[:60]!r} | item links {len(links)}")
                      print("  sample links:", links[:4])
                      print("  json calls:", apis[:6])
                      priced = [i for i, l in enumerate(body) if re.search(r"(\$|NT\$|HK\$|S\$|A\$|NZ\$)\s?[\d,]+", l)]
                      for i in priced[:10]:
                          print("  |", " / ".join(body[max(0, i - 2):i + 1])[:160])
                      if not priced:
                          print("  first lines:", body[:25])
                  except Exception as e:
                      print(f"=== {u}\n  ERROR {type(e).__name__}: {str(e)[:200]}")
              b.close()
