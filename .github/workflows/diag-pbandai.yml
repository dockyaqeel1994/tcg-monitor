name: diag p-bandai cards (temporary)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && playwright install --with-deps chromium > /dev/null
      - shell: python
        run: |
          from playwright.sync_api import sync_playwright
          urls = ["https://p-bandai.com/nz/series/onepiece-series?_f_brands=06-0074&_f_series=03-002",
                  "https://p-bandai.com/us/series/onepiece-series"]
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_context(locale="en-US").new_page()
              for u in urls:
                  pg.goto(u, wait_until="domcontentloaded", timeout=60000)
                  pg.wait_for_timeout(12000)
                  cards = pg.eval_on_selector_all("a[href*='/item/']", """els => els.map(a => {
                      let n = a; for (let i = 0; i < 4 && n.parentElement; i++) n = n.parentElement;
                      return a.href + '  ||  ' + n.innerText.replace(/\\s+/g, ' ').slice(0, 220); })""")
                  print(f"=== {u}  ({len(cards)} item links)")
                  for c in cards[:14]:
                      print("  |", c)
              b.close()
