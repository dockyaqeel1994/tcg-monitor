name: TCG monitor (Kai preorders)
on:
  schedule:
    - cron: "3,33 * * * *"   # every 30 min: ~1 billed min/run = ~1440 of the 2000 free min/month
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a sample alert (to check Discord/email work)"
        type: boolean
        default: false
      report:
        description: "Only post a stock report (everything in stock now)"
        type: boolean
        default: false
concurrency:
  group: tcg-kai   # separate from the other stores so it never waits behind them
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py ${{ inputs.test_alert && '--test-alert' || inputs.report && '--report' || '--group kai' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ORDER_NAME: ${{ secrets.ORDER_NAME }}
          ORDER_PHONE: ${{ secrets.ORDER_PHONE }}
          ORDER_ADDRESS: ${{ secrets.ORDER_ADDRESS }}
          ORDER_ITEM: ${{ vars.ORDER_ITEM }}
          SINGLES_MIN: ${{ vars.SINGLES_MIN }}
      - run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
