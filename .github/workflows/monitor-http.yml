name: TCG monitor (http stores)
on:
  schedule:
    - cron: "7 * * * *"   # hourly: private repos get 2000 free Actions min/month
  workflow_dispatch:
concurrency:
  group: tcg-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py --group http
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ORDER_NAME: ${{ secrets.ORDER_NAME }}
          ORDER_PHONE: ${{ secrets.ORDER_PHONE }}
          ORDER_ADDRESS: ${{ secrets.ORDER_ADDRESS }}
          SINGLES_MIN: ${{ vars.SINGLES_MIN }}
      - run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase -q && git push)
