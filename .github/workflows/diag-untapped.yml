name: diag untapped (temporary)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && playwright install --with-deps chromium > /dev/null
      - shell: python
        run: |
          import re
          from playwright.sync_api import sync_playwright
          base = "https://www.untappedpotentialtcg.co.za"
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(locale="en-ZA")
              for url in [base + "/category/onepiece?type=pre", base + "/category/onepiece?type=sealed"]:
                  pg.goto(url, wait_until="domcontentloaded", timeout=60000)
                  pg.wait_for_timeout(15000)
                  print(f"=== {url}")
                  nxt = pg.eval_on_selector_all("a", "e => e.filter(x => /next/i.test(x.innerText)).map(x => x.href)")
                  print("next links:", nxt)
                  links = sorted(set(pg.eval_on_selector_all("a[href*='/product']", "e => e.map(x => x.href)")))
                  print("product links:", len(links), links[:10])
                  body = [l.strip() for l in pg.inner_text("body").splitlines() if l.strip()]
                  k = next((i for i, l in enumerate(body) if l.upper() == "PRE-ORDERS"), 0)
                  for l in body[k:k + 70]:
                      print("  |", l[:120])
              b.close()
